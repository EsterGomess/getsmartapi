<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}GieokGonggan{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:480px;background:#ffffff;border:1px solid #e4e4e7;border-radius:8px;padding:32px;">
            <tr>
              <td>
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
